@version: 4.12

options {
    keep-hostname(yes);
    use-dns(no);
    log-msg-size(65536);
};

source s_network {
    syslog(ip("0.0.0.0") port(5514) transport("auto"));
    syslog(ip("0.0.0.0") port(5514) transport("udp"));
};

destination d_received {
    file("/var/log/syslog/received.log"
        template("${ISODATE} ${HOST} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
        template-escape(yes)
        create-dirs(yes)
        dir-perm(0750)
        perm(0640)
        logrotate(enable(yes), size(100MB), rotations(5))
    );
};

log {
    source(s_network);
    destination(d_received);
};
